name: Deploy to GitHub Pages

on:
    push:
        branches: ['main']
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Create .env file
              run: |
                  echo NEXT_PUBLIC_MANIFEST_VERSION=$(sha1sum public/data/stigs/manifest.json | awk '{print $1}') >> .env

            - name: Build App
              env:
                  # Build-time (SSG) fetches need a server serving public/;
                  # the base path must NOT be set for it, or its routes move.
                  NEXT_PUBLIC_API_URL: 'http://localhost:3000'
              run: |
                  npm run dev &
                  PID=$!
                  for i in $(seq 1 30); do
                      curl -sf http://localhost:3000 >/dev/null && break
                      sleep 1
                  done

                  NEXT_PUBLIC_BASE_PATH=/stigui npm run build

                  kill $PID

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: out

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
