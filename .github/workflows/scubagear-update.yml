name: ScubaGear baselines update

# CISA publishes ScubaGear releases on its own timetable; this checks
# daily and refreshes the committed baselines when a release actually
# changed baseline content. No-op runs commit nothing: a product is
# staged only when its converted content differs, and git push with no
# diff is a no-op.

on:
    schedule:
        - cron: "37 6 * * *" # daily 06:37 UTC
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: scubagear-update
    cancel-in-progress: false

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Setup Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: '3.12'

            - name: Install dependencies
              run: npm ci

            - name: Resolve latest ScubaGear release
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  TAG=$(gh api repos/cisagov/ScubaGear/releases/latest --jq .tag_name)
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                  echo "Latest ScubaGear release: $TAG"

            - name: Convert baselines at that release
              run: |
                  python3 scripts/scuba/run.py convert --tag "${{ steps.release.outputs.tag }}"

            - name: Commit updated baselines
              run: |
                  if git diff --quiet public/data; then
                      echo "No baseline content changed; nothing to commit"
                      exit 0
                  fi
                  git config user.name 'github-actions[bot]'
                  git config user.email 'github-actions[bot]@users.noreply.github.com'
                  git add public/data/stigs
                  git commit -m "CISA ScubaGear baselines update: ${{ steps.release.outputs.tag }}"
                  git push
