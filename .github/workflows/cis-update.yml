name: CIS catalog update

# Daily check of CIS's download portal for new or updated benchmarks.
# Clean conversions publish straight to main; conversions with findings
# open a draft PR for local review. State lives in
# scripts/cis/catalog-state.json; the portal link lives in the
# CIS_PORTAL_URL secret (never committed).

on:
    schedule:
        - cron: "30 6 * * *" # daily 06:30 UTC
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: cis-update
    cancel-in-progress: false

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Setup Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: '3.12'

            - name: Install converter dependencies
              run: pip install -r scripts/cis/requirements.txt

            - name: Install Playwright browser
              run: npx playwright install --with-deps chromium

            - name: Detect catalog changes
              id: detect
              env:
                  CIS_PORTAL_URL: ${{ secrets.CIS_PORTAL_URL }}
              run: |
                  node scripts/cis/catalog-update.mjs detect \
                      --state scripts/cis/catalog-state.json \
                      --docs-out new-docs.json

            - name: Fetch new benchmark PDFs
              if: steps.detect.outputs.updated == 'true'
              env:
                  CIS_PORTAL_URL: ${{ secrets.CIS_PORTAL_URL }}
              run: |
                  node scripts/cis/catalog-update.mjs download \
                      --docs new-docs.json --out data/cis/bulk

            - name: Convert new benchmarks
              if: steps.detect.outputs.updated == 'true'
              run: |
                  DATE=$(date +%Y%m%d%H%M)
                  echo "DATE=$DATE" >> "$GITHUB_ENV"
                  mkdir -p /tmp/stage "data/cis/reports/cis-update-$DATE"
                  jq -r '.[].filename' new-docs.json | while IFS= read -r f; do
                      pdf="data/cis/bulk/$f"
                      base="${f%.pdf}"
                      python3 scripts/cis/run.py convert "$pdf" \
                          --out /tmp/stage \
                          --report "data/cis/reports/cis-update-$DATE/$base.txt" \
                          > /dev/null 2>&1 || true
                  done

            - name: Tier conversions
              id: tier
              if: steps.detect.outputs.updated == 'true'
              run: |
                  : > clean-list.txt
                  : > dirty-list.txt
                  for r in "data/cis/reports/cis-update-$DATE"/*.txt; do
                      base=$(basename "$r" .txt)
                      if grep -q "Result: CLEAN" "$r"; then
                          echo "$base" >> clean-list.txt
                      else
                          echo "$base" >> dirty-list.txt
                      fi
                  done
                  echo "clean=$(wc -l < clean-list.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
                  echo "dirty=$(wc -l < dirty-list.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

            - name: Publish clean conversions to main
              if: steps.detect.outputs.updated == 'true' && steps.tier.outputs.clean != '0'
              run: |
                  while IFS= read -r base; do
                      cp "/tmp/stage/$base.json" public/data/stigs/schema/
                      cp "/tmp/stage/$base.xml" public/data/stigs/schema/
                  done < clean-list.txt
                  python3 -c "
                      import sys
                      from pathlib import Path
                      sys.path.insert(0, 'scripts/cis')
                      from cis_converter import emit
                      emit.regenerate_manifest(
                          Path('public/data/stigs/schema'),
                          Path('public/data'),
                      )
                  "
                  git config user.name 'github-actions[bot]'
                  git config user.email 'github-actions[bot]@users.noreply.github.com'
                  git add public/data/stigs scripts/cis/catalog-state.json
                  git commit -m "CIS catalog update: ${{ steps.tier.outputs.clean }} clean benchmark conversions"
                  git push

            - name: Open draft PR for conversions needing review
              if: steps.detect.outputs.updated == 'true' && steps.tier.outputs.dirty != '0'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  BRANCH="cis-review-$DATE"
                  git checkout -b "$BRANCH"
                  while IFS= read -r base; do
                      if [ -f "/tmp/stage/$base.json" ]; then
                          cp "/tmp/stage/$base.json" public/data/stigs/schema/
                          cp "/tmp/stage/$base.xml" public/data/stigs/schema/
                      fi
                      mkdir -p "data/cis/reviews/$DATE"
                      cp "data/cis/reports/cis-update-$DATE/$base.txt" \
                          "data/cis/reviews/$DATE/" 2>/dev/null || true
                  done < dirty-list.txt
                  # state lands with the PR so daily runs don't re-fire
                  git add public/data/stigs data/cis/reviews scripts/cis/catalog-state.json
                  git commit -m "CIS catalog update: ${{ steps.tier.outputs.dirty }} conversions need review ($DATE)" || true
                  git push -u origin "$BRANCH"
                  {
                      echo "Benchmarks converted with findings that need a"
                      echo "human pass before shipping. Reports are in"
                      echo "data/cis/reviews/$DATE/ on this branch."
                      echo ""
                      echo "| benchmark | findings |"
                      echo "|---|---|"
                      while IFS= read -r base; do
                          n=$(grep -c "^\s*- \[" "data/cis/reports/cis-update-$DATE/$base.txt" 2>/dev/null || echo "?")
                          echo "| $base | $n |"
                      done < dirty-list.txt
                  } > pr-body.md
                  gh pr create --draft --base main --head "$BRANCH" \
                      --title "CIS catalog: ${{ steps.tier.outputs.dirty }} conversions need review" \
                      --body-file pr-body.md

            - name: Summary
              run: |
                  echo "New/updated benchmarks: ${{ steps.detect.outputs.count || 0 }}"
                  echo "Clean (published): ${{ steps.tier.outputs.clean || 0 }}"
                  echo "Needs review (draft PR): ${{ steps.tier.outputs.dirty || 0 }}"
