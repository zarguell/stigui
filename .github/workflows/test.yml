name: Test

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0

            - name: Setup Node.js
              uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2.5.2
              with:
                  node-version: '22'

            - name: Create .env file
              run: |
                  echo NEXT_PUBLIC_MANIFEST_VERSION=$(sha1sum public/data/stigs/manifest.json | awk '{print $1}') >> .env

            - name: Retrieve the cached "node_modules" directory (if present)
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              id: node-cache
              with:
                  path: ./node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('./package-lock.json') }}-v1

            - name: Install dependencies
              run: npm install
              if: steps.node-cache.outputs.cache-hit != 'true'

            - name: Setup Python for the CIS converter tests
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: '3.12'

            - name: Install Python dependencies
              run: |
                  python3 -m pip install --upgrade pip
                  python3 -m pip install -r scripts/cis/requirements.txt

            - run: npm run test

            - name: Run the CIS converter test suite
              working-directory: scripts/cis
              run: python3 -m pytest tests/ -q
